[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltalock-extract"
version = "1.0.0"
description = "Alpha-free extract of DeltaLock infrastructure: the never-short guard, exit prices from broker truth, the stop-order ledger and live-stream field selection"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
